version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "15:00"

    open-pull-requests-limit: 10

    labels:
      - dependencies

    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "15:30"

    open-pull-requests-limit: 10

    labels:
      - dependencies
      - github-actions
